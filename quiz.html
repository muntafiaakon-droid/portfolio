<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Test</title>

    <link rel="stylesheet" href="quiz.css">
</head>

<body>

    <h1>Quiz Test</h1>
    <button id="startBtn" onclick="startQuiz()">
    🎯 Start Quiz
</button>
<p id="questionNumber"></p>
<p id="timer">সময়: 10</p>
<div id="progressBar">
    <div id="progress"></div>
</div>
    <h2 id="question"></h2>

    <div id="answers"></div>

    <button id="nextBtn" onclick="nextQuestion()">
        Next
    </button>

    <button id="restartBtn" onclick="restartQuiz()" style="display:none;">
        Restart Quiz
    </button>

    <p id="result"></p>

    <script src="quiz.js"></script>

</body>
</html>
